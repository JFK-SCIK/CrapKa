<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CrapKa</title>
<link rel="stylesheet" href="styles.css?v=54">
</head>
<body>

<div id="main">
  <div id="game-col">
    <div id="hdr">
      <h1>🃏 CrapKa</h1>
      <div id="hdr-controls">
        <div id="speedrow">
          <span>⚡</span>
          <input type="range" id="spd" min="0" max="5" step="1" value="3" oninput="setSpeed(this.value)">
        </div>
        <span id="step-controls" style="display:none;align-items:center;gap:4px;font-size:0.62rem;color:var(--text2);">
          <input type="checkbox" id="step-check" onchange="toggleStepMode()" title="Pas-à-pas IA">
          <label for="step-check" style="cursor:pointer">PàP</label>
          <button class="btn" id="step-next" onclick="stepOrPlay()" style="display:none;padding:3px 8px;">▶</button>
          <button class="btn" id="btn-seq-toggle" onclick="toggleBFSeqPin()" style="display:none;padding:3px 6px;" title="Afficher/masquer les séquences BF">≡</button>
          <button class="btn" id="btn-trace" onclick="toggleTrace()" style="display:none;padding:3px 6px;" title="Mode trace IA (log extensif)">🔍</button>
          <button class="btn" id="btn-trace-dl" onclick="downloadTrace()" style="display:none;padding:3px 6px;" title="Télécharger le log trace">⬇</button>
          <button class="btn" id="btn-etrace-dl" onclick="downloadExecTrace()" style="display:none;padding:3px 6px;" title="Télécharger la trace d'exécution">📊</button>
        </span>
        <button class="btn" id="btn-debug" onclick="toggleDebug()" title="Mode debug">🐛</button>
        <button class="btn" id="btn-undo" onclick="undo()" title="Retour arrière">↩</button>
        <button class="btn" onclick="chooseSaveDir()" title="Choisir le dossier de sauvegarde">📁</button>
        <button class="btn" onclick="saveToFile()" title="Sauvegarder">💾</button>
        <button class="btn" onclick="loadFromFile()" title="Charger une sauvegarde (fichier)">📂</button>
        <button class="btn" onclick="snapshot()">📋</button>
        <button class="btn" onclick="showRules()" title="Règles du jeu">📖</button>
        <button class="btn red" onclick="showMenu()">Menu</button>
      </div>
    </div>
    <div id="status">Bienvenue dans CrapKa !</div>
    <div id="game"></div>
    <div id="abar"></div>
  </div>
  <div id="resizer"></div>
  <div id="sidebar">
    <div id="seqlog">
      <div id="seqlog-title">Séquences BF</div>
    </div>
    <div class="stitle">
      <span>Coups</span>
      <button onclick="clearMoveLog()">✕</button>
    </div>
    <div id="movelog"></div>
  </div>
</div><!-- #main -->
<div id="movl"><div id="mbox">
  <h2 id="mtitle"></h2><p id="mbody"></p><div id="mbtns"></div>
</div></div>

<script>const _EXPECTED={game:'1.2.0',ai:'1.2.33',ui:'1.2.21',app:'1.2.0'};</script>
<script src="game.js?v=54"></script>
<script src="ai.js?v=54"></script>
<script src="net.js?v=54"></script>
<script src="ui.js?v=54"></script>
<script src="app.js?v=54"></script>
</body>
</html>
