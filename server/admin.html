<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrapKa Admin</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--accent:#e94560;--gold:#f5a623;--text:#eaeaea;--text2:#a0a0b0;--green:#4caf50;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:sans-serif;padding:20px;max-width:900px;margin:0 auto;}
h1{color:var(--gold);font-size:1.5rem;margin-bottom:2px;}
.sub{color:var(--text2);font-size:0.78rem;margin-bottom:10px;}
.section{background:var(--bg2);border-radius:8px;padding:16px;margin-bottom:18px;}
.section h2{color:var(--gold);font-size:0.95rem;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bg3);}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bg3);}
.section-hdr h2{margin-bottom:0;padding-bottom:0;border-bottom:none;}
table{width:100%;border-collapse:collapse;font-size:0.83rem;}
th{color:var(--text2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--bg3);white-space:nowrap;}
th.num{text-align:right;}
td{padding:5px 8px;border-bottom:1px solid var(--bg3);}
tr:last-child td{border-bottom:none;}
.stats-num{text-align:right;font-variant-numeric:tabular-nums;}
.row-player{cursor:pointer;user-select:none;}
.row-player:hover td{background:rgba(255,255,255,0.04);}
.toggle{display:inline-block;width:14px;font-size:0.68rem;transition:transform 0.15s;color:var(--text2);vertical-align:middle;}
.toggle.open{transform:rotate(90deg);}
.vs td{color:var(--text2);font-style:italic;background:var(--bg);}
.gold{color:var(--gold);font-weight:bold;}
.win{color:var(--green);}
.lose{color:var(--accent);}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.card{background:var(--bg3);border-radius:6px;padding:10px 16px;text-align:center;min-width:90px;}
.card .val{font-size:1.6rem;font-weight:bold;color:var(--gold);}
.card .lbl{font-size:0.72rem;color:var(--text2);margin-top:2px;}
.filter{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
input[type=date]{background:var(--bg3);color:var(--text);border:1px solid var(--bg3);padding:5px 8px;border-radius:4px;font-size:0.83rem;}
button{background:var(--accent);color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:0.83rem;}
button.sec{background:var(--bg3);}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:0.72rem;font-weight:bold;}
.badge-ai{background:#555;color:#ddd;}
.badge-net{background:var(--accent);color:#fff;}
.badge-solo{background:#2a6e4a;color:#cfe;}
.badge-aband{background:#5a3a1a;color:#fda;}
.empty{color:var(--text2);text-align:center;padding:12px 0;font-style:italic;}
.rooms-table{margin-top:12px;}
.actions{display:flex;gap:8px;margin-bottom:18px;align-items:center;flex-wrap:wrap;}
.btn-icon{background:var(--bg3);color:var(--text);border:none;padding:6px 11px;border-radius:4px;cursor:pointer;font-size:1.1rem;line-height:1;}
.btn-icon:hover{filter:brightness(1.3);}
.danger{background:var(--accent)!important;color:#fff!important;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:20px 24px;min-width:260px;max-width:420px;width:90%;position:relative;}
.modal-box h3{color:var(--gold);margin-bottom:14px;font-size:0.95rem;}
.modal-close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--text2);font-size:1.1rem;cursor:pointer;padding:0;line-height:1;}
.modal-close:hover{color:var(--text);}
#preprod-badge{display:inline-block;background:#f5813a;color:#fff;font-size:0.6rem;font-weight:bold;letter-spacing:1px;padding:2px 7px;border-radius:4px;vertical-align:middle;margin-left:8px;}
</style>
</head>
<body>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<h1>🃏 CrapKa Admin</h1>
<p class="sub" id="version-lbl" style="margin-bottom:2px">…</p>
<p class="sub" id="refresh-lbl">Chargement…</p>
<div class="actions">
  <button class="btn-icon" onclick="refresh()" title="Rafraîchir">↺</button>
  <button class="sec" onclick="deployNow()">🚀 Deploy immédiat</button>
  <button class="sec" id="btn-deploy-wait" onclick="toggleDeployWait()">⏳ Deploy différé</button>
</div>

<div class="section">
  <div class="section-hdr">
    <h2>📡 Statut serveur</h2>
  </div>
  <div class="cards" id="status-cards"></div>
  <div id="parties-wrap"></div>
</div>

<div class="section">
  <h2>🤖 Profils IA</h2>
  <div id="ai-profiles-list"><span class="empty">Chargement…</span></div>
</div>

<div class="section">
  <div class="section-hdr">
    <h2>💾 Sauvegardes</h2>
    <button class="sec" onclick="loadSaves()">↺</button>
  </div>
  <div id="saves-list"><span class="empty">Chargement…</span></div>
</div>

<div class="section">
  <h2>📊 Statistiques</h2>
  <table>
    <thead><tr>
      <th>Joueur</th>
      <th>ID</th>
      <th class="num">Parties</th>
      <th class="num">Victoires</th>
      <th class="num">Défaites</th>
      <th class="num">%</th>
    </tr></thead>
    <tbody id="stats-body"><tr><td colspan="6" class="empty">Chargement…</td></tr></tbody>
  </table>
</div>

<div class="section">
  <h2>📅 Historique des parties</h2>
  <div class="filter">
    <input type="date" id="date-filter">
    <button onclick="loadGames()">Filtrer</button>
    <button class="sec" onclick="document.getElementById('date-filter').value='';loadGames()">Toutes</button>
  </div>
  <table>
    <thead><tr><th>Date</th><th>Heure</th><th>Mode</th><th>Vainqueur 🏆</th><th>Perdant</th><th style="text-align:right;white-space:nowrap"><input type="checkbox" id="games-select-all" title="Tout sélectionner" onchange="document.querySelectorAll('.game-cb').forEach(cb=>cb.checked=this.checked)" style="cursor:pointer;vertical-align:middle"> <button onclick="deleteSelectedGames()" class="sec" style="font-size:0.75rem;padding:3px 8px">🗑 Supprimer</button></th></tr></thead>
    <tbody id="games-body"><tr><td colspan="6" class="empty">Chargement…</td></tr></tbody>
  </table>
</div>

<script>
const pct = (w,g) => g>0 ? Math.round(w/g*100)+'%' : '—';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const PWD = new URLSearchParams(location.search).get('pwd') || '';
let _deployPending = false;
let _lastRooms = [];
let _lastStats  = null;
const _expanded = new Set();
let _playersData = {};

async function loadPlayers() {
  try { _playersData = await fetch('/players').then(r=>r.json()); } catch {}
}

function _aliasOf(key) {
  const m = String(key).match(/\(([a-f0-9]{8})\)$/);
  return m ? m[1] : null;
}
function _realName(key) {
  const alias = _aliasOf(key);
  if (!alias) return null;
  const entry = Object.values(_playersData).find(e => e.alias === alias);
  return (entry && entry.last_name) ? entry.last_name : null;
}
function displayName(key) {
  const real = _realName(key);
  if (real) return esc(real);
  // Pas d'alias connu : afficher la partie nom avant la parenthèse si présente
  const m = String(key).match(/^(.+)\([a-f0-9]{8}\)$/);
  return m ? esc(m[1]) : esc(key);
}
function displayAlias(key) {
  const alias = _aliasOf(key);
  if (alias) return alias;
  // Clé sans format alias : chercher par last_name dans playersData
  const entry = Object.values(_playersData).find(e => e.last_name === String(key));
  return entry ? entry.alias : '—';
}

// ── Deploy ──────────────────────────────────────────────────────────────────

let _pollTimer   = null;
let _serverDown  = false;
let _fastPolling = false;

function _setLbl(txt) {
  document.getElementById('refresh-lbl').textContent = txt;
}

function _startPoll(fast) {
  _fastPolling = fast;
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(_tick, fast ? 5000 : 30000);
}

async function _tick() {
  try {
    await fetch('/health');
    if (_serverDown) {
      _serverDown = false;
      _deployPending = false;
      updateDeployBtn();
    }
    await refresh();
    if (_fastPolling) await loadVersion();
  } catch {
    if (!_serverDown) {
      _serverDown = true;
      _setLbl('🔄 Redémarrage du serveur en cours…');
    }
  }
}

function updateDeployBtn() {
  const btn = document.getElementById('btn-deploy-wait');
  if (_deployPending) {
    btn.classList.add('danger');
    btn.textContent = '⏳ En attente… (annuler)';
  } else {
    btn.classList.remove('danger');
    btn.textContent = '⏳ Deploy différé';
  }
}

async function deployNow() {
  const d = await fetch('/status').then(r=>r.json()).catch(()=>({rooms:[]}));
  const active = (d.rooms||[]).filter(r=>r.connected.some(Boolean));
  if (active.length > 0) {
    if (!confirm('⚠️ '+active.length+' salle(s) avec joueur(s) connecté(s).\nDéployer quand même ?')) return;
  }
  const r = await fetch('/deploy/now?pwd='+encodeURIComponent(PWD), {method:'POST'}).then(r=>r.json()).catch(()=>null);
  if (r && r.ok) {
    if (r.up_to_date) {
      _setLbl('✅ Déjà à jour — aucun déploiement nécessaire.');
    } else {
      _setLbl('🚀 Deploy lancé — surveillance toutes les 5s…');
      _startPoll(true);
      setTimeout(_tick, 3000);
    }
  } else {
    _setLbl('❌ Erreur lors du déploiement.');
  }
}

async function toggleDeployWait() {
  if (_deployPending) {
    const r = await fetch('/deploy/wait?pwd='+encodeURIComponent(PWD), {method:'DELETE'}).catch(()=>null);
    if (r && r.ok) { _deployPending = false; updateDeployBtn(); _startPoll(false); }
  } else {
    const r = await fetch('/deploy/wait?pwd='+encodeURIComponent(PWD), {method:'POST'}).catch(()=>null);
    if (r && r.ok) { _deployPending = true; updateDeployBtn(); _startPoll(true); }
  }
}

// ── Modal joueurs ───────────────────────────────────────────────────────────

function showPlayersPopup() {
  const connected = [];
  for (const r of _lastRooms) {
    for (let i = 0; i < r.players.length; i++) {
      if (r.connected[i]) connected.push({name: r.players[i], code: r.code, phase: r.phase});
    }
  }
  document.getElementById('modal-title').textContent = '👥 Joueurs connectés';
  if (!connected.length) {
    document.getElementById('modal-body').innerHTML =
      '<p style="color:var(--text2);font-style:italic;padding:4px 0">Aucun joueur connecté.</p>';
  } else {
    const phaseLabel = p => p === 'play' ? 'en jeu' : p === 'game-over' ? 'fin de partie' : 'en attente';
    let html = '<table style="width:100%">';
    for (const p of connected) {
      html += `<tr>
        <td class="gold" style="padding:5px 0">${esc(p.name)}</td>
        <td style="color:var(--text2);text-align:right;padding:5px 0">${esc(p.code)} — ${phaseLabel(p.phase)}</td>
      </tr>`;
    }
    html += '</table>';
    document.getElementById('modal-body').innerHTML = html;
  }
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// ── Status ──────────────────────────────────────────────────────────────────

document.getElementById('date-filter').value = new Date().toISOString().slice(0,10);

async function loadStatus() {
  try {
    const d = await fetch('/status').then(r=>r.json());
    _lastRooms = d.rooms || [];
    const playing = _lastRooms.filter(r=>r.phase==='play').length;
    const waiting = _lastRooms.filter(r=>r.phase===null).length;
    const players = _lastRooms.reduce((s,r)=>s+r.connected.filter(Boolean).length, 0);
    const soloActive = d.solo_active || [];
    document.getElementById('status-cards').innerHTML = `
      <div class="card"><div class="val">${d.count}</div><div class="lbl">Salles réseau</div></div>
      <div class="card"><div class="val">${playing}</div><div class="lbl">En cours</div></div>
      <div class="card"><div class="val">${waiting}</div><div class="lbl">En attente</div></div>
      <div class="card"><div class="val">${players}</div><div class="lbl">Connectés</div></div>
      <div class="card"><div class="val">${soloActive.length}</div><div class="lbl">Solo actifs</div></div>`;
    const rows = [];
    for (const s of soloActive) {
      const depuis = s.started ? new Date(s.started).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '—';
      const idleVal = s.idle_min ?? s.elapsed_min;
      const idle    = idleVal != null ? idleVal + ' min' : '—';
      const pname   = s.name || s.alias || '?';
      rows.push(`<tr>
        <td style="color:var(--text2);font-size:0.78rem">Solo</td>
        <td class="gold">${esc(pname)} <span style="color:var(--text2)">vs IA</span></td>
        <td style="color:var(--text2)">—</td>
        <td style="color:var(--text2)">${depuis}</td>
        <td style="color:var(--text2)">${idle}</td>
        <td class="stats-num">${s.moves ?? 0}</td>
      </tr>`);
    }
    for (const r of _lastRooms) {
      const suspended = r.phase && r.phase !== 'game-over' && r.connected.every(c => !c);
      const names = r.players.map((n,i) => r.connected[i] ? `<b>${esc(n)}</b>` : esc(n)).join(' <span style="color:var(--text2)">vs</span> ');
      const phaseCell = suspended
        ? `<span style="color:#f5813a;font-weight:bold">⏸ En suspens</span>`
        : `<span style="color:var(--text2)">${r.phase||'—'}</span>`;
      rows.push(`<tr${suspended ? ' style="opacity:0.75"' : ''}>
        <td class="gold">${esc(r.code)}</td>
        <td>${names}</td>
        <td>${phaseCell}</td>
        <td style="color:var(--text2)">—</td>
        <td style="color:var(--text2)">${r.idle_min} min</td>
        <td class="stats-num">—</td>
      </tr>`);
    }
    if (rows.length) {
      document.getElementById('parties-wrap').innerHTML =
        '<table class="rooms-table" style="margin-top:12px"><thead><tr>'
        + '<th>Salle</th><th>Joueurs</th><th>Phase</th><th>Depuis</th><th>Inactivité</th><th class="num">Coups</th>'
        + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
    } else {
      document.getElementById('parties-wrap').innerHTML = '';
    }
    if (typeof d.pending_deploy !== 'undefined' && d.pending_deploy !== _deployPending) {
      _deployPending = d.pending_deploy;
      updateDeployBtn();
    }
  } catch(e) {
    document.getElementById('status-cards').innerHTML = '<span style="color:var(--text2)">Erreur de chargement.</span>';
  }
}

// ── Stats ───────────────────────────────────────────────────────────────────

async function deleteStat(name) {
  if (!confirm('Supprimer "' + name + '" des statistiques ?')) return;
  await fetch('/admin/delete_stat?pwd='+encodeURIComponent(PWD)+'&key='+encodeURIComponent(name), {method:'POST'});
  await loadStats();
}

function togglePlayer(name) {
  if (_expanded.has(name)) _expanded.delete(name);
  else _expanded.add(name);
  if (_lastStats) renderStats(_lastStats);
}

function renderStats(data) {
  const _isAI = k => !String(k).includes('(');
  const players = Object.entries(data).sort((a,b) => {
    if (_isAI(a[0]) && !_isAI(b[0])) return -1;
    if (!_isAI(a[0]) && _isAI(b[0])) return 1;
    return b[1].games - a[1].games;
  });
  if (!players.length) {
    document.getElementById('stats-body').innerHTML = '<tr><td colspan="6" class="empty">Aucune statistique.</td></tr>';
    return;
  }
  let html = '';
  for (const [name, st] of players) {
    const exp = _expanded.has(name);
    const vsEntries = Object.entries(st.vs).sort((a,b) => b[1].games - a[1].games);
    const arrow = vsEntries.length
      ? `<span class="toggle${exp ? ' open' : ''}">▶</span>`
      : `<span class="toggle"></span>`;
    const alias = displayAlias(name);
    html += `<tr class="row-player" data-name="${esc(name)}" onclick="togglePlayer(this.dataset.name)">
      <td class="gold" style="padding-left:6px">${arrow} ${displayName(name)}
        <button onclick="event.stopPropagation();deleteStat('${esc(name)}')"
          style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:0.75em;margin-left:6px;opacity:0.5;" title="Supprimer">✕</button>
      </td>
      <td style="color:var(--text2);font-size:0.8em;font-family:monospace">${alias}</td>
      <td class="stats-num">${st.games}</td>
      <td class="stats-num win">${st.wins}</td>
      <td class="stats-num lose">${st.losses}</td>
      <td class="stats-num">${pct(st.wins, st.games)}</td>
    </tr>`;
    for (const [opp, vs] of vsEntries) {
      html += `<tr class="vs"${exp ? '' : ' style="display:none"'}>
        <td style="padding-left:28px">↳ vs ${displayName(opp)}</td>
        <td style="color:var(--text2);font-size:0.8em;font-family:monospace">${displayAlias(opp)}</td>
        <td class="stats-num">${vs.games}</td>
        <td class="stats-num win">${vs.wins}</td>
        <td class="stats-num lose">${vs.losses}</td>
        <td class="stats-num">${pct(vs.wins, vs.games)}</td>
      </tr>`;
    }
  }
  document.getElementById('stats-body').innerHTML = html;
}

async function loadAIConfig() {
  try {
    const cfg = await fetch('/ai/config').then(r=>r.json());
    const profiles = cfg.profiles || [];
    const el = document.getElementById('ai-profiles-list');
    if (!profiles.length) {
      el.innerHTML = '<span class="empty">Aucun profil disponible.</span>';
      return;
    }
    el.innerHTML = profiles.map(p=>`
      <div style="padding:8px 0;border-bottom:1px solid var(--bg3);">
        <div style="display:flex;align-items:center;gap:12px;">
          <input type="checkbox" id="ai-cb-${esc(p.key)}" ${p.enabled?'checked':''} onchange="toggleAI('${esc(p.key)}',this.checked)" style="width:16px;height:16px;cursor:pointer;">
          <label for="ai-cb-${esc(p.key)}" style="cursor:pointer;font-weight:bold;min-width:90px;">${esc(p.name)}</label>
          <span style="color:var(--text2);font-size:0.78rem;min-width:70px;">${esc(p.key)}</span>
          <span style="font-family:monospace;font-size:0.78rem;color:var(--gold);">${p.version?'v'+esc(p.version):'—'}</span>
          <span style="color:var(--text2);font-size:0.78rem;">${p.updated||'—'}</span>
          <span style="margin-left:auto;font-size:0.78rem;color:${p.enabled?'var(--green)':'var(--accent)'};">${p.enabled?'Actif':'Désactivé'}</span>
        </div>
        ${p.git_hash?`<div style="margin-top:3px;margin-left:28px;font-size:0.74rem;color:var(--text2);">
          <span style="font-family:monospace;color:var(--accent);">${esc(p.git_hash)}</span>
          <span style="margin-left:6px;">${esc(p.git_msg||'')}</span>
        </div>`:''}
      </div>`).join('');
  } catch(e) {
    document.getElementById('ai-profiles-list').innerHTML = '<span class="empty">Erreur de chargement.</span>';
  }
}

async function toggleAI(key, enabled) {
  try {
    await fetch(`/admin/ai_toggle?key=${encodeURIComponent(key)}&enabled=${enabled}&pwd=${encodeURIComponent(PWD)}`,{method:'POST'});
    await loadAIConfig();
  } catch(e) {}
}

async function loadStats() {
  try {
    _lastStats = await fetch('/stats').then(r=>r.json());
    renderStats(_lastStats);
  } catch(e) {
    document.getElementById('stats-body').innerHTML = '<tr><td colspan="5" class="empty">Erreur.</td></tr>';
  }
}

// ── Games ───────────────────────────────────────────────────────────────────

async function deleteSelectedGames() {
  const cbs = [...document.querySelectorAll('.game-cb:checked')];
  if (!cbs.length) return;
  if (!confirm('Supprimer ' + cbs.length + ' partie(s) ?')) return;
  for (const cb of cbs) {
    await fetch('/admin/delete_game?pwd='+encodeURIComponent(PWD)+'&ts='+encodeURIComponent(cb.dataset.ts), {method:'POST'});
  }
  document.getElementById('games-select-all').checked = false;
  await loadGames();
}

async function loadGames() {
  const date = document.getElementById('date-filter').value;
  try {
    const url = date ? `/games?date=${date}` : '/games';
    const games = await fetch(url).then(r=>r.json());
    if (!games.length) {
      document.getElementById('games-body').innerHTML = '<tr><td colspan="6" class="empty">Aucune partie.</td></tr>';
      return;
    }
    let html = '';
    for (const g of [...games].reverse()) {
      const dt   = new Date(g.ts);
      const day  = dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
      const hour = dt.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
      const isAbandoned = g.status === 'abandoned';
      // Les clés joueurs réseau contiennent toujours "(uuid8)" ; les noms IA et keys anonymes non
      const isSolo = !String(g.winner).includes('(') || !String(g.loser).includes('(');
      const badge = isAbandoned
        ? '<span class="badge badge-aband">Aband.</span>'
        : isSolo
          ? '<span class="badge badge-solo">Solo</span>'
          : '<span class="badge badge-net">Réseau</span>';
      const winnerCell = isAbandoned
        ? `<td style="color:var(--text2)">${displayName(g.winner)}</td>`
        : `<td class="win">${displayName(g.winner)}</td>`;
      const loserCell = isAbandoned
        ? `<td style="color:var(--text2);font-style:italic">—</td>`
        : `<td class="lose">${g.loser === '?' ? '<span style="color:var(--text2)">?</span>' : displayName(g.loser)}</td>`;
      html += `<tr>
        <td style="color:var(--text2)">${day}</td>
        <td style="color:var(--text2)">${hour}</td>
        <td>${badge}</td>
        ${winnerCell}
        ${loserCell}
        <td style="text-align:right"><input type="checkbox" class="game-cb" data-ts="${esc(g.ts)}" style="cursor:pointer"></td>
      </tr>`;
    }
    document.getElementById('games-body').innerHTML = html;
  } catch(e) {
    document.getElementById('games-body').innerHTML = '<tr><td colspan="6" class="empty">Erreur.</td></tr>';
  }
}

// ── Saves ────────────────────────────────────────────────────────────────────

async function loadSaves() {
  try {
    const saves = await fetch('/saves').then(r=>r.json());
    const el = document.getElementById('saves-list');
    if (!saves.length) {
      el.innerHTML = '<span class="empty">Aucune sauvegarde.</span>';
      return;
    }
    let html = '<table style="width:100%"><thead><tr>'
      + '<th>Nom</th><th>IA</th><th>Date</th><th style="width:70px"></th>'
      + '</tr></thead><tbody>';
    for (const s of saves) {
      const dt = s.created ? new Date(s.created).toLocaleString('fr-FR', {
        day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'
      }) : '—';
      html += `<tr>
        <td>${esc(s.name)}</td>
        <td style="color:var(--text2)">${esc(s.ai_name||'—')}</td>
        <td style="color:var(--text2);font-size:0.8em">${dt}</td>
        <td style="display:flex;gap:4px;justify-content:flex-end;padding:4px 8px">
          <button onclick="renameSave('${esc(s.id)}',${JSON.stringify(s.name)})"
            title="Renommer" style="background:var(--bg3);border:none;color:var(--text);padding:2px 7px;border-radius:4px;cursor:pointer;font-size:0.8rem;">✏</button>
          <button onclick="deleteSaveAdmin('${esc(s.id)}')"
            title="Supprimer" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:0.75em;opacity:0.5;">✕</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    document.getElementById('saves-list').innerHTML = '<span class="empty">Erreur de chargement.</span>';
  }
}

async function renameSave(id, currentName) {
  const name = prompt('Nouveau nom :', currentName);
  if (!name || !name.trim()) return;
  await fetch('/saves/'+encodeURIComponent(id)+'?pwd='+encodeURIComponent(PWD), {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name: name.trim()}),
  });
  await loadSaves();
}

async function deleteSaveAdmin(id) {
  if (!confirm('Supprimer cette sauvegarde ?')) return;
  await fetch('/saves/'+encodeURIComponent(id), {method:'DELETE'});
  await loadSaves();
}

// ── Version git ──────────────────────────────────────────────────────────────

let _deployedHash = '';

async function loadVersion() {
  try {
    const v = await fetch('/version').then(r => r.json());
    const dt = v.date ? new Date(v.date).toLocaleString('fr-FR', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    }) : '?';
    document.getElementById('version-lbl').textContent =
      `📦 ${v.hash} · ${v.message} · ${dt} (${v.branch})`;
    if (_deployedHash && v.hash && v.hash !== _deployedHash) {
      _deployedHash = v.hash;
      _setLbl('✅ Déploiement terminé ! (' + v.hash + ')');
      _startPoll(false);
    } else {
      _deployedHash = v.hash || _deployedHash;
    }
  } catch {
    document.getElementById('version-lbl').textContent = '📦 version inconnue';
  }
}

// ── Main ─────────────────────────────────────────────────────────────────────

async function refresh() {
  await Promise.all([loadPlayers(), loadStatus(), loadGames(), loadAIConfig(), loadSaves()]);
  await loadStats();
  if (!_serverDown && !_fastPolling) {
    _setLbl('Actualisé à ' + new Date().toLocaleTimeString('fr-FR') + ' — rafraîchissement auto toutes les 30s');
  }
}

if (location.port === '8001') {
  const b = document.createElement('span');
  b.id = 'preprod-badge';
  b.textContent = 'PRÉPROD';
  document.querySelector('h1').append(b);
}
loadVersion();
refresh();
_startPoll(false);
</script>
