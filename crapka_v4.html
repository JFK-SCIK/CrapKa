function _cloneState(g,ui){
  return {
    g:{
      players:g.players.map(p=>({
        name:p.name,
        crapette:[...p.crapette],
        hand:[...p.hand],
        defausse:p.defausse.map(d=>[...d]),
      })),
      commons:g.commons.map(p=>[...p]),
      pioche:[...g.pioche],
      futurePioche:[...g.futurePioche],
      cur:g.cur,phase:g.phase,winner:g.winner,
      startDefSnap:g.startDefSnap?g.startDefSnap.map(p=>[...p]):null,
      startCommonsSnap:g.startCommonsSnap?g.startCommonsSnap.map(p=>[...p]):null,
      startKingValSnap:g.startKingValSnap?[...g.startKingValSnap]:null,
      startKingPendSnap:g.startKingPendSnap?[...g.startKingPendSnap]:null,
    },
    ui:{
      pileKingVal:[...ui.pileKingVal],
      pileKingPending:[...ui.pileKingPending],
    }
  };
}

function _sTopNum(g,ui,ci){
  const pile=g.commons[ci];
  if(!pile.length) return 0;
  const t=pile[pile.length-1];
  if(t.num===13){
    if(ui.pileKingVal[ci]!==null) return ui.pileKingVal[ci];
    return 13;
  }
  return t.num;
}

function _sCanOnCommon(g,ui,card,ci){
  const pile=g.commons[ci];
  if(!pile.length) return card.num===1;
  const tNum=_sTopNum(g,ui,ci);
  if(tNum===12) return false;
  if(ui.pileKingPending[ci]) return card.num!==1&&card.num!==13;
  if(card.num===13) return tNum<12&&tNum>0;
  return card.num===tNum+1;
}

function _sResolveKing(g,ui,ci){
  const pile=g.commons[ci];
  if(!pile.length) return;
  const king=pile[pile.length-1];
  if(!king||king.num!==13) return;
  if(pile.length===1){ui.pileKingPending[ci]=true;ui.pileKingVal[ci]=null;return;}
  const below=pile[pile.length-2];
  const belowVal=below.num===13?(ui.pileKingVal[ci]!==null?ui.pileKingVal[ci]:13):below.num;
  const newVal=belowVal+1;
  ui.pileKingPending[ci]=false;
  if(newVal>=12){
    ui.pileKingVal[ci]=null;
    g.futurePioche.push(...pile);
    g.commons[ci]=[];
    ui.pileKingPending[ci]=false;
  } else {
    ui.pileKingVal[ci]=newVal;
  }
}

function _sRemove(g,pidx,card,src){
  const p=g.players[pidx];
  if(src.type==='hand'){const i=p.hand.findIndex(c=>c.uid===card.uid);if(i>=0)p.hand.splice(i,1);}
  else if(src.type==='crapette'){if(p.crapette.length) p.crapette.pop();}
  else if(src.type==='defausse'){const pile=p.defausse[src.index];if(pile.length&&pile[pile.length-1].uid===card.uid)pile.pop();}
}

function _sPlay(g,ui,pidx,card,src,ci){
  _sRemove(g,pidx,card,src);
  g.commons[ci].push(card);
  if(card.num===13) _sResolveKing(g,ui,ci);
  else if(ui.pileKingPending[ci]){ui.pileKingPending[ci]=false;ui.pileKingVal[ci]=card.num-1;}
  else{ui.pileKingVal[ci]=null;ui.pileKingPending[ci]=false;}
  if(g.players[pidx].crapette.length===0){g.phase='game-over';g.winner=pidx;}
}

function _sClear(g,ui,ci){
  g.futurePioche.push(...g.commons[ci]);
  g.commons[ci]=[];
  ui.pileKingVal[ci]=null;ui.pileKingPending[ci]=false;
}

function _sDrawSafe(g,pidx){
  const p=g.players[pidx];
  let iters=0;
  while(p.hand.length<5&&iters<60){
    iters++;
    if(g.pioche.length===0){
      if(!g.futurePioche.length) break;
      g.pioche=[...g.futurePioche];g.futurePioche=[];
    }
    if(g.pioche.length) p.hand.push(g.pioche.pop());
    else break;
  }
  p.hand.sort((a,b)=>a.num-b.num);
}

// Sources VISIBLES pour un joueur (adversaire = seulement crapette+défausse)
function _sSources(g,pidx,visibleOnly){
  const p=g.players[pidx];
  const srcs=[];
  // Crapette : toujours visible
  if(p.crapette.length) srcs.push({card:p.crapette[p.crapette.length-1],src:{type:'crapette'}});
  // Défausse : toujours visible
  for(let i=0;i<4;i++){if(p.defausse[i].length) srcs.push({card:p.defausse[i][p.defausse[i].length-1],src:{type:'defausse',index:i}});}
  // Main : visible seulement si c'est notre joueur
  if(!visibleOnly) for(const c of p.hand) srcs.push({card:c,src:{type:'hand'}});
  return srcs;
}

// Règle unique pour le roi : ne jouer un roi sur pile ci que si
// la crapette peut se poser directement après (crNum === kingWillBe+1).
// La condition "vider la main" est trop complexe à évaluer en 1 coup → supprimée.
function _kingPlayable(g,ui,pidx,ci,visibleOnly){
  const p=g.players[pidx];
  const crT=p.crapette.length?p.crapette[p.crapette.length-1]:null;
  const crNum=crT?crT.num:0;
  const tNum=_sTopNum(g,ui,ci);
  const kingWillBe=tNum+1;

  if(!visibleOnly){
    const kings=p.hand.filter(hc=>hc.num===13).length;
    const nonKings=p.hand.filter(hc=>hc.num!==13);

    // Condition 3 : main = que des rois → chaîne → dame → main vide
    if(kings>=1&&nonKings.length===0){
      let val=kingWillBe;
      let roisRestants=kings-1;
      while(roisRestants>0&&val<13){val++;roisRestants--;}
      if(val>=12) return true;
      if(val<12) return true;
    }

    // Condition 4 : simulation séquence complète avec cartes en main (sans piocher)
    // Tester si jouer ce roi sur ci mène à poser la crapette
    if(_kingLeadsToCrapette(g,ui,pidx,ci)) return true;
  }

  if(kingWillBe>=12) return false;
  const nextNeeded=kingWillBe+1;
  if(nextNeeded>12) return false;

  // Condition 1 : crapette immédiatement après
  if(crNum===nextNeeded) return true;

  if(!visibleOnly){
    const nonKings2=p.hand.filter(hc=>hc.num!==13);
    // Condition 2 : roi + carte nextNeeded = main vide après
    const hasNext=nonKings2.some(hc=>hc.num===nextNeeded);
    const othersAfter=nonKings2.filter(hc=>hc.num!==nextNeeded);
    if(hasNext&&othersAfter.length===0) return true;
  }
  return false;
}

// Simuler la séquence de coups depuis la main courante (sans piocher)
// pour voir si jouer un roi sur ci mène à poser la crapette
function _kingLeadsToCrapette(g,ui,pidx,ci){
  // Cloner l'état minimal
  const hand=[...g.players[pidx].hand];
  const crapette=[...g.players[pidx].crapette];
  const piles=g.commons.map(p=>[...p]);
  const kv=[...ui.pileKingVal];
  const kp=[...ui.pileKingPending];

  function topNum(c){
    const pile=piles[c];
    if(!pile.length) return 0;
    const t=pile[pile.length-1];
    if(t.num===13) return kv[c]!==null?kv[c]:13;
    return t.num;
  }
  function canPlay(card,c){
    const pile=piles[c];
    if(!pile.length) return card.num===1;
    const tn=topNum(c);
    if(tn===12) return false;
    if(kp[c]) return card.num!==1&&card.num!==13;
    if(card.num===13) return tn<12&&tn>0;
    return card.num===tn+1;
  }
  function playOn(card,c){
    // Retirer de hand ou crapette
    const hi=hand.findIndex(hc=>hc.uid===card.uid);
    if(hi>=0) hand.splice(hi,1);
    else if(crapette.length&&crapette[crapette.length-1].uid===card.uid) crapette.pop();
    // Poser sur la pile
    piles[c].push(card);
    if(card.num===13){
      if(piles[c].length===1){kp[c]=true;kv[c]=null;}
      else{
        const below=piles[c][piles[c].length-2];
        const bv=below.num===13?(kv[c]!==null?kv[c]:13):below.num;
        const nv=bv+1;
        kp[c]=false;
        if(nv>=12){piles[c]=[];kv[c]=null;kp[c]=false;}
        else kv[c]=nv;
      }
    } else if(kp[c]){kp[c]=false;kv[c]=card.num-1;}
    else{kv[c]=null;kp[c]=false;}
    // Dame → écart
    if(topNum(c)===12){piles[c]=[];kv[c]=null;kp[c]=false;}
  }

  // Jouer le roi sur ci d'abord
  const king=hand.find(hc=>hc.num===13);
  if(!king) return false;
  playOn(king,ci);

  // Simuler coups gloutons (max 20 itérations)
  let moved=true,iters=0;
  while(moved&&iters<20){
    moved=false;iters++;
    // Vider dames
    for(let c=0;c<4;c++){if(topNum(c)===12){piles[c]=[];kv[c]=null;kp[c]=false;moved=true;break;}}
    if(moved) continue;
    // Jouer crapette
    if(crapette.length){
      const cr=crapette[crapette.length-1];
      for(let c=0;c<4;c++){if(canPlay(cr,c)){playOn(cr,c);moved=true;break;}}
      if(moved) continue;
    }
    // Jouer main
    for(const hc of [...hand]){
      for(let c=0;c<4;c++){if(canPlay(hc,c)){playOn(hc,c);moved=true;break;}}
      if(moved) break;
    }
  }
  // La crapette a-t-elle progressé (ou été posée) ?
  return crapette.length<g.players[pidx].crapette.length;
}

// Vérifie si une carte de défausse adverse était jouable au début du tour IA
// en utilisant les snapshots stockés dans g
function _sWasPlayable(g,defIdx,oppIdx){
  if(!g.startDefSnap||!g.startCommonsSnap){
    if(_debugMode) addMoveLog('[sWP] NO SNAP di='+defIdx,'sys');
    return false;
  }
  const snap=g.startDefSnap[defIdx];
  if(!snap||!snap.length){
    if(_debugMode) addMoveLog('[sWP] EMPTY SNAP di='+defIdx,'sys');
    return false;
  }
  const card=snap[snap.length-1];
  if(_debugMode){
    window._dbgDemandLog=window._dbgDemandLog||[];
    const snapTops=g.startCommonsSnap.map(p=>p.length?p[p.length-1].value+p[p.length-1].suit:'_').join(',');
    window._dbgDemandLog.push('sWP di='+defIdx+' card='+card.value+card.suit+' piles='+snapTops);
  }
  const commSnap=g.startCommonsSnap;
  const kvSnap=g.startKingValSnap||[null,null,null,null];
  const kpSnap=g.startKingPendSnap||[false,false,false,false];
  for(let ci=0;ci<4;ci++){
    const snapPile=commSnap[ci];
    const t=snapPile&&snapPile.length?snapPile[snapPile.length-1]:null;
    const kVal=kvSnap[ci];
    const kPend=kpSnap[ci];
    let tNum=0;
    if(t){
      if(t.num===13&&kVal!==null) tNum=kVal;
      else if(t.num===13&&kPend) tNum=13;
      else tNum=t.num;
    }
    if(!t&&card.num===1) return true;
    if(!t) continue;
    if(tNum===12) continue;
    if(kPend&&card.num!==1&&card.num!==13) return true;
    if(card.num===13&&tNum<12) return true;
    if(card.num===tNum+1) return true;
  }
  return false;
}

// Coups légaux — visibleOnly=true pour l'adversaire
function _sLegal(g,ui,pidx,visibleOnly){
  const p=g.players[pidx];
  const moves=[];

  // Coups imposés (priorité absolue, pas de branchement)
  for(let ci=0;ci<4;ci++) if(_sTopNum(g,ui,ci)===12) return [{type:'clear',ci}];
  for(let ci=0;ci<4;ci++){
    if(ui.pileKingPending[ci]){
      const srcs=_sSources(g,pidx,visibleOnly);
      const playable=srcs.filter(({card})=>_sCanOnCommon(g,ui,card,ci));
      if(playable.length) return [{type:'play',card:playable[0].card,src:playable[0].src,ci}];
      return [{type:'clear',ci}];
    }
  }

  // Piles vides : as d'abord (visible), sinon pioche (un seul choix)
  for(let ci=0;ci<4;ci++){
    if(!g.commons[ci].length){
      const srcs=_sSources(g,pidx,visibleOnly);
      const ace=srcs.find(({card})=>card.num===1);
      if(ace) moves.push({type:'play',card:ace.card,src:ace.src,ci});
      else if(g.pioche.length>0||g.futurePioche.length>0) moves.push({type:'init',ci});
    }
  }

  // Coups normaux
  const srcs=_sSources(g,pidx,visibleOnly);
  for(const {card,src} of srcs){
    for(let ci=0;ci<4;ci++){
      if(!g.commons[ci].length) continue;
      if(_sCanOnCommon(g,ui,card,ci)){
        // Roi : seulement si utile selon règle centralisée
        if(card.num===13){
          if(!_kingPlayable(g,ui,pidx,ci,visibleOnly)) continue;
          // Si piles vides/pending existent et chaîne incomplète → init d'abord
          const hasEmpty=g.commons.some((_p,ci2)=>g.commons[ci2].length===0||ui.pileKingPending[ci2]);
          const kings=p.hand.filter(hc=>hc.num===13).length;
          const finalVal=_sTopNum(g,ui,ci)+kings;
          if(hasEmpty&&finalVal<12) continue;
          // Si D en main est DÉJÀ jouable sur cette pile → bloquer R (D joue d'abord)
          if(!visibleOnly&&p.hand.some(hc=>hc.num===12&&_sCanOnCommon(g,ui,hc,ci))) continue;
        }
        moves.push({type:'play',card,src,ci});
      }
    }
  }

  // Demandes : cartes de défausse adverse jouables au début du tour IA
  if(!visibleOnly){
    const oppIdx=1-pidx;
    const opp=g.players[oppIdx];
    for(let di=0;di<4;di++){
      const card=opp.defausse[di].length?opp.defausse[di][opp.defausse[di].length-1]:null;
      if(!card) continue;
      if(_sWasPlayable(g,di,oppIdx)){
        for(let ci=0;ci<4;ci++){
          if(_sCanOnCommon(g,ui,card,ci)){
            moves.push({type:'demand',card,oppIdx,defIdx:di,ci});
            break;
          }
        }
      }
    }
  }

  // Fin de tour : défausser une carte de la main (pas crapette)
  for(let di=0;di<4;di++){
    const defTop=p.defausse[di].length?p.defausse[di][p.defausse[di].length-1]:null;
    if(visibleOnly) continue; // l'adversaire en simulation ne "choisit" pas sa défausse
    for(const c of p.hand){
      if(!defTop||defTop.num!==1||c.num===1){
        moves.push({type:'end',card:c,src:{type:'hand'},di});
        break; // une option de défausse suffit par pile
      }
    }
  }

  return moves;
}

function _sApply(g,ui,pidx,mv){
  const s=_cloneState(g,ui);
  const ng=s.g,nui=s.ui;
  if(mv.type==='clear') _sClear(ng,nui,mv.ci);
  else if(mv.type==='play') _sPlay(ng,nui,pidx,mv.card,mv.src,mv.ci);
  else if(mv.type==='init'){
    if(!ng.pioche.length&&ng.futurePioche.length){ng.pioche=[...ng.futurePioche];ng.futurePioche=[];}
    if(ng.pioche.length){
      const d=ng.pioche.pop();
      ng.commons[mv.ci].push(d);
      if(d.num===13) _sResolveKing(ng,nui,mv.ci);
      else{nui.pileKingVal[mv.ci]=null;nui.pileKingPending[mv.ci]=false;}
    }
  } else if(mv.type==='demand'){
    const oppDef=ng.players[mv.oppIdx].defausse[mv.defIdx];
    if(oppDef.length&&oppDef[oppDef.length-1].uid===mv.card.uid) oppDef.pop();
    ng.commons[mv.ci].push(mv.card);
    if(mv.card.num===13) _sResolveKing(ng,nui,mv.ci);
    else if(nui.pileKingPending[mv.ci]){nui.pileKingPending[mv.ci]=false;nui.pileKingVal[mv.ci]=mv.card.num-1;}
    else{nui.pileKingVal[mv.ci]=null;nui.pileKingPending[mv.ci]=false;}
  } else if(mv.type==='end'){
    _sRemove(ng,pidx,mv.card,mv.src);
    ng.players[pidx].defausse[mv.di].push(mv.card);
    ng.cur=1-pidx;
    // Pas de piochage : on évalue sans traverser la frontière de piochage
  }
  return {g:ng,ui:nui};
}

// ══════════════════════════════════════════════
// ÉVALUATION
// ══════════════════════════════════════════════
function _eval(g,ui,aiIdx){
  if(g.phase==='game-over') return g.winner===aiIdx?10000:-10000;
  const ai=g.players[aiIdx],opp=g.players[1-aiIdx];
  let sc=0;
  sc+=(21-ai.crapette.length)*50-(21-opp.crapette.length)*50;
  const crT=ai.crapette.length?ai.crapette[ai.crapette.length-1]:null;
  if(crT) for(let ci=0;ci<4;ci++) if(_sCanOnCommon(g,ui,crT,ci)){sc+=30;break;}
  for(const c of ai.hand) for(let ci=0;ci<4;ci++) if(_sCanOnCommon(g,ui,c,ci)){sc+=4;break;}
  const oppCrT=opp.crapette.length?opp.crapette[opp.crapette.length-1]:null;
  if(oppCrT) for(let ci=0;ci<4;ci++) if(_sCanOnCommon(g,ui,oppCrT,ci)){
    sc-=40; // bloquer la crapette adverse : priorité haute (≈ jouer 1 carte de sa crapette)
    break;
  }
  // Bonus piles : distance circulaire vers crNum-1 (plus proche = plus utile)
  if(crT){
    const crNum=crT.num;
    const target=(crNum-1+12)%12||12; // valeur juste avant la crapette
    for(let ci=0;ci<4;ci++){
      const tn=_sTopNum(g,ui,ci);
      if(tn>0&&tn<12){
        const dist=(target-tn+12)%12; // 0=pile prête, 11=très loin
        sc+=Math.max(0,(11-dist)*2); // dist=0→+22, dist=4→+14, dist=6→+10
      }
    }
  }
  if(ai.hand.length===0&&(g.pioche.length>0||g.futurePioche.length>0)) sc+=10;

  // Bonus : piles activables par une carte visible de l'IA (main ou défausse)
  const aiSrcs=[
    ...ai.hand,
    ...ai.defausse.map(d=>d.length?d[d.length-1]:null).filter(Boolean)
  ];
  for(let ci=0;ci<4;ci++){
    const tn=_sTopNum(g,ui,ci);
    if(tn>0&&tn<12){
      if(aiSrcs.some(card=>card.num===tn+1)) sc+=8;
    }
  }
  // Bonus diversité des défausses IA : valeurs différentes exposées
  const defVals=new Set(ai.defausse.map(d=>d.length?d[d.length-1].num:null).filter(n=>n!==null));
  sc+=defVals.size*3; // plus de valeurs différentes = plus de flexibilité

  // (malus crapette adverse déjà compté ci-dessus)

  return sc;
}

// ══════════════════════════════════════════════
// MINIMAX
// ══════════════════════════════════════════════
let _mmNodes=0;
const _MM_MAX_NODES=3000;

// Priorité d'un coup pour le tri dans minimax
// Clé stable unique pour tie-break dans le tri des moves
function _mvKey(mv){
  const ci=mv.ci!==undefined?mv.ci:0;
  const uid=mv.card?mv.card.uid:0;
  const srcType=mv.src?mv.src.type:'';
  const srcIdx=mv.src&&mv.src.index!==undefined?mv.src.index:0;
  // Combiner en un entier : ci*100000 + uid*10 + srcIdx
  return ci*100000 + uid*10 + srcIdx;
}

function _mvPrio(mv,g,ui,pidx){
  if(!mv) return 0;
  if(mv.type==='clear') return 25;
  if(mv.type==='demand'){
    const p=g.players[pidx];
    const crT=p.crapette.length?p.crapette[p.crapette.length-1]:null;
    const crNum=crT?crT.num:0;
    const tAfterDemand=mv.card.num;
    if(crNum>0&&tAfterDemand===crNum-1) return 90;
    if(crNum>0){const dist=(crNum-1-tAfterDemand+12)%12;if(dist<=3) return 55;}
    return 20;
  }
  if(mv.type==='init') return 5;
  if(mv.type==='play'){
    const p=g.players[pidx];
    const crT=p.crapette.length?p.crapette[p.crapette.length-1]:null;
    const crNum=crT?crT.num:0;
    // Crapette non-roi : priorité absolue (toujours jouer la crapette)
    if(mv.src&&mv.src.type==='crapette'&&mv.card.num!==13) return 100;
    if(crNum>0&&mv.card.num===crNum-1) return 60;
    // Bonus source : main > défausse > crapette
    const srcBonus=mv.src?(mv.src.type==='hand'?3:mv.src.type==='defausse'?0:1):0;
    if(mv.card.num===12) return 35+srcBonus;
    if(mv.card.num===13){
      // Compter tous les rois disponibles (main + crapette si elle est un roi)
      const kingsInHand=p.hand.filter(hc=>hc.num===13).length;
      const crT2=p.crapette.length?p.crapette[p.crapette.length-1]:null;
      const crIsKing=(crT2&&crT2.num===13&&mv.src&&mv.src.type!=='crapette')?1:0;
      const kings=kingsInHand+crIsKing;
      const finalVal=_sTopNum(g,ui,mv.ci)+kings+1;
      // Roi depuis crapette : bonus supplémentaire car vide la crapette
      const crBonus=(mv.src&&mv.src.type==='crapette')?10:0;
      // Bonus si une carte visible (main/défausse) peut se poser après le roi
      // (kingWillBe = valeur du roi = topNum+1, nextNeeded = kingWillBe+1)
      const kingWillBe=_sTopNum(g,ui,mv.ci)+1;
      const nextNeeded=kingWillBe+1;
      const hasNextVisible=nextNeeded<=12&&(
        p.hand.some(hc=>hc.num===nextNeeded)||
        p.defausse.some(d=>{const t=d.length?d[d.length-1]:null;return t&&t.num===nextNeeded;})
      );
      const nextBonus=hasNextVisible?15:0;
      if(finalVal>=12) return 80+crBonus+nextBonus;
      if(finalVal>=10) return 40+crBonus+nextBonus;
      return 5+crBonus+nextBonus;
    }
    return 10;
  }
  return 0;
}

function _miniMaxBestSequence(depth){
  _mmNodes=0;
  const aiIdx=UI.aiIdx;
  const {g:sg,ui:sui}=_cloneState(G,UI);

  if(_debugMode){
    // Évaluer chaque branche de premier niveau et logguer
    const lm=_sLegal(sg,sui,aiIdx,false).filter(m=>m.type!=='end');
    const sorted=lm.slice().sort((a,b)=>{
      const dp=_mvPrio(b,sg,sui,aiIdx)-_mvPrio(a,sg,sui,aiIdx);
      return dp!==0?dp:_mvKey(a)-_mvKey(b);
    }).slice(0,8);
    window._dbgKingLog=[];
    for(const mv of sorted){
      const {g:ng,ui:nui}=_sApply(sg,sui,aiIdx,mv);
      const res=_mmTurn(ng,nui,aiIdx,depth-1,[mv],true,-Infinity,Infinity);
      const seq=res.moves.map(m=>{
        const card=m.card?m.card.value+m.card.suit:'-';
        const src=m.src?(m.src.type==='hand'?'M':m.src.type==='crapette'?'C':'D'+((m.src.index||0)+1)):'-';
        return card+'['+src+']'+(m.ci!==undefined?'→P'+(m.ci+1):m.di!==undefined?'→d'+(m.di+1):'');
      }).join(', ');
      window._dbgKingLog.push(seq+' | score='+res.score);
    }
    // Maintenant faire la vraie recherche complète
    _mmNodes=0;
  }

  if(_debugMode){
    const lm=_sLegal(sg,sui,aiIdx,false);
    window._dbgDemandLog=window._dbgDemandLog||[];
    window._dbgDemandLog.push('Legal('+lm.length+'): '+lm.slice(0,6).map(m=>m.type+(m.card?m.card.value+m.card.suit:'')+(m.ci!==undefined?'P'+(m.ci+1):'')+(m.defIdx!==undefined?'D'+(m.defIdx+1):'')).join('|'));
    // Sources IA
    const srcs=_sSources(sg,aiIdx,false);
    window._dbgDemandLog.push('Sources: '+srcs.map(s=>s.card.value+s.card.suit+'['+s.src.type[0]+']').join(' '));
    window._dbgDemandLog.push('Piles: '+sg.commons.map((p,i)=>'P'+(i+1)+'='+(p.length?p[p.length-1].value+p[p.length-1].suit:'_')).join(' '));
  }
  const res=_mmTurn(sg,sui,aiIdx,depth,[],true,-Infinity,Infinity);
  return res.moves||[];
}

function _mmTurn(g,ui,aiIdx,depth,acc,isAI,alpha,beta){
  if(_mmNodes>_MM_MAX_NODES) return {score:_eval(g,ui,aiIdx),moves:acc};
  if(g.phase==='game-over'||depth<=0) return {score:_eval(g,ui,aiIdx),moves:acc};

  const pidx=g.cur;
  // Cartes visibles seulement pour l'adversaire
  const visOnly=(pidx!==aiIdx);
  const lm=_sLegal(g,ui,pidx,visOnly);
  if(!lm.length) return {score:_eval(g,ui,aiIdx),moves:acc};

  // Séparer play/clear/init (en cours de tour) de end (fin de tour)
  const playing=lm.filter(m=>m.type!=='end');
  const ending=lm.filter(m=>m.type==='end');

  let best=isAI?{score:-Infinity,moves:acc}:{score:Infinity,moves:acc};

  const consider=(mv,isContinue)=>{
    if(_mmNodes>_MM_MAX_NODES) return;
    _mmNodes++;
    const {g:ng,ui:nui}=_sApply(g,ui,pidx,mv);
    let res;
    if(mv.type==='end'){
      // Fin de tour = frontière de piochage → évaluer immédiatement
      const sc=_eval(ng,nui,aiIdx);
      res={score:sc,moves:isContinue?[...acc,mv]:acc};
    } else {
      // Même joueur, continuer le tour (depth ne change pas dans le même tour)
      res=_mmTurn(ng,nui,aiIdx,depth,[...acc,mv],isAI,alpha,beta);
    }
    if(isAI){
      if(res.score>best.score) best=res;
      alpha=Math.max(alpha,best.score);
    } else {
      if(res.score<best.score) best=res;
      beta=Math.min(beta,best.score);
    }
    return alpha>=beta; // pruning
  };

  // Trier et tronquer les coups (priorités) avec tie-break stable
  const sorted=playing.slice().sort((a,b)=>{
    const dp=_mvPrio(b,g,ui,g.cur)-_mvPrio(a,g,ui,g.cur);
    if(dp!==0) return dp;
    return _mvKey(a)-_mvKey(b);
  });

  const top=sorted.slice(0,isAI?4:3); // branching factor réduit pour éviter explosion
  for(const mv of top){ if(consider(mv,true)) break; }

  // Option de terminer le tour
  for(const mv of ending.slice(0,2)){ if(consider(mv,true)) break; }

  if(best.score===(isAI?-Infinity:Infinity)) return {score:_eval(g,ui,aiIdx),moves:acc};
  return best;
}

// Appliquer un move à G/UI globaux
function _applyMoveToState(g,ui,mv){
  const pidx=g.cur;
  if(mv.type==='clear'){
    g.futurePioche.push(...g.commons[mv.ci]);
    g.commons[mv.ci]=[];
    ui.pileKingVal[mv.ci]=null;ui.pileKingPending[mv.ci]=false;
    _animating=true;setTimeout(()=>{_animating=false;},200);
  } else if(mv.type==='play'){
    _sRemove(g,pidx,mv.card,mv.src);
    g.commons[mv.ci].push(mv.card);
    if(mv.card.num===13) _sResolveKing(g,ui,mv.ci);
    else if(ui.pileKingPending[mv.ci]){ui.pileKingPending[mv.ci]=false;ui.pileKingVal[mv.ci]=mv.card.num-1;}
    else{ui.pileKingVal[mv.ci]=null;ui.pileKingPending[mv.ci]=false;}
    if(g.players[pidx].crapette.length===0){g.phase='game-over';g.winner=pidx;}
  } else if(mv.type==='init'){
    if(mv.card){
      // Carte déjà déterminée (as ou carte piochée en simulation)
      if(mv.src) _sRemove(g,g.cur,mv.card,mv.src);
      g.commons[mv.ci].push(mv.card);
      if(mv.card.num===13) _sResolveKing(g,ui,mv.ci);
      else{ui.pileKingVal[mv.ci]=null;ui.pileKingPending[mv.ci]=false;}
    } else {
      // Retourner depuis la pioche
      if(!g.pioche.length&&g.futurePioche.length){g.pioche=g.futurePioche.splice(0);g.futurePioche=[];}
      if(g.pioche.length){
        const d=g.pioche.pop();
        g.commons[mv.ci].push(d);
        if(d.num===13) _sResolveKing(g,ui,mv.ci);
        else{ui.pileKingVal[mv.ci]=null;ui.pileKingPending[mv.ci]=false;}
      }
    }
  }
}

// ══════════════════════════════════════════════
// GREEDY (niveau 1)
// ══════════════════════════════════════════════
function _aiGreedyMove(){
  const p=G.players[G.cur];
  for(let ci=0;ci<4;ci++){
    if(topNum(ci)===12){
      _q({type:'clear',ci});_applyMoveToState(G,UI,{type:'clear',ci});return true;
    }
  }
  for(let ci=0;ci<4;ci++){
    if(UI.pileKingPending[ci]){
      const crTop=peek(p.crapette);const crNum=crTop?crTop.num:0;
      const cards=_aiAllCards();
      const playable=cards.filter(({c})=>_sCanOnCommon(G,UI,c,ci));
      if(playable.length){
        playable.sort((a,b)=>Math.abs(a.c.num-crNum-1)-Math.abs(b.c.num-crNum-1));
        const best=playable[0];
        UI.pileKingPending[ci]=false;UI.pileKingVal[ci]=best.c.num-1;
        _q({type:'play',card:best.c,src:best.src,ci});
        _applyMoveToState(G,UI,{type:'play',card:best.c,src:best.src,ci});
      } else {
        _q({type:'clear',ci});_applyMoveToState(G,UI,{type:'clear',ci});
      }
      return true;
    }
  }
  for(let ci=0;ci<4;ci++){
    if(!G.commons[ci].length){
      const ace=_findAce();
      if(ace){_q({type:'init',ci,card:ace.card,src:ace.src});_applyMoveToState(G,UI,{type:'init',ci,card:ace.card,src:ace.src});}
      else if(G.pioche.length>0||G.futurePioche.length>0){
        // Laisser _applyMoveToState gérer le piochage via mv.card=null
        _q({type:'init',ci,card:null,src:null});
        _applyMoveToState(G,UI,{type:'init',ci,card:null,src:null});
      }
      else continue;
      return true;
    }
  }
  const crTop=peek(p.crapette);
  if(crTop){
    // Choisir la meilleure pile pour la crapette (pas forcément la première)
    const crMoves=[];
    for(let ci=0;ci<4;ci++){
      if(canOnCommon(crTop,ci)){
        crMoves.push({type:'play',card:crTop,src:{type:'crapette'},ci});
      }
    }
    if(crMoves.length){
      // Trier par _mvPrio pour choisir la meilleure pile
      crMoves.sort((a,b)=>{
        const pa=_mvPrio(a,G,UI,G.cur),pb=_mvPrio(b,G,UI,G.cur);
        if(pa!==pb) return pb-pa;
        // Tie-break : préférer la pile avec topNum le plus élevé (plus avancée)
        return topNum(b.ci)-topNum(a.ci);
      });
      const best=crMoves[0];
      _q(best);_applyMoveToState(G,UI,best);return true;
    }
  }
  // Jouer d'abord les non-rois jouables, puis les rois utiles
  const handSorted=_aiSortHand(p.hand).sort((a,b)=>{
    if(a.num===13&&b.num!==13) return 1;
    if(a.num!==13&&b.num===13) return -1;
    return 0;
  });
  for(const card of handSorted) for(let ci=0;ci<4;ci++) if(canOnCommon(card,ci)){if(card.num===13&&!_kingIsUseful(ci))continue;_q({type:'play',card,src:{type:'hand'},ci});_applyMoveToState(G,UI,{type:'play',card,src:{type:'hand'},ci});return true;}
  for(let di=0;di<4;di++){
    const dt=peek(p.defausse[di]);if(!dt)continue;
    for(let ci=0;ci<4;ci++){
      if(!canOnCommon(dt,ci)) continue;
      if(dt.num===13&&!_kingIsUseful(ci)) continue;
      // Préférer jouer depuis la main si la même valeur est disponible
      // sauf si jouer depuis la défausse révèle une carte précieuse (dans les 2 premières)
      const sameInHand=p.hand.some(h=>h.num===dt.num&&canOnCommon(h,ci));
      if(sameInHand){
        // Vérifier si la carte sous dt est précieuse et non disponible ailleurs
        const pile=p.defausse[di];
        const below=pile.length>1?pile[pile.length-2]:null;
        const crTop=peek(p.crapette);const crNum=crTop?crTop.num:0;
        const belowPrecious=below&&crNum>0&&(()=>{
          const target=(crNum-1+12)%12||12;
          const dist=(target-below.num+12)%12;
          return dist<=3;
        })();
        const belowAvailableElsewhere=!below||p.hand.some(h=>h.num===below.num)||
          p.defausse.some((d2,j)=>j!==di&&d2.some(x=>x.num===below.num));
        if(!belowPrecious||belowAvailableElsewhere) continue; // jouer depuis main à la place
      }
      _q({type:'play',card:dt,src:{type:'defausse',index:di},ci});
      _applyMoveToState(G,UI,{type:'play',card:dt,src:{type:'defausse',index:di},ci});
      return true;
    }
  }
  return false;
}

function _kingIsUseful(ci){
  // Délègue à la règle centralisée
  return _kingPlayable(G,UI,G.cur,ci,false);
}

function _aiAllCards(){
  const p=G.players[G.cur];
  return [
    ...p.hand.map(c=>({c,src:{type:'hand'}})),
    peek(p.crapette)?{c:peek(p.crapette),src:{type:'crapette'}}:null,
    ...p.defausse.map((pile,i)=>peek(pile)?{c:peek(pile),src:{type:'defausse',index:i}}:null)
  ].filter(Boolean);
}

function _findAce(){
  const p=G.players[G.cur];
  const ct=peek(p.crapette);if(ct&&ct.num===1)return{card:ct,src:{type:'crapette'}};
  for(let i=0;i<4;i++){const t=peek(p.defausse[i]);if(t&&t.num===1)return{card:t,src:{type:'defausse',index:i}};}
  const h=p.hand.find(c=>c.num===1);if(h)return{card:h,src:{type:'hand'}};
  return null;
}

function _aiSortHand(hand){
  const crTop=peek(G.players[G.cur].crapette);const crNum=crTop?crTop.num:0;
  return [...hand].sort((a,b)=>{
    const da=Math.abs(a.num-crNum),db=Math.abs(b.num-crNum);
    if(da!==db) return da-db;
    return a.uid-b.uid; // tie-break stable par uid
  });
}

function _aiDiscard(){
  const p=G.players[G.cur];

  // Si main vide ET pile vide ET pioche dispo → initialiser la pile AVANT de défausser
  // (permet de piocher une carte potentiellement utile)
  if(p.hand.length===0){
    for(let ci=0;ci<4;ci++){
      if(G.commons[ci].length===0&&(G.pioche.length>0||G.futurePioche.length>0)){
        const ace=_findAce();
        if(ace){
          _q({type:'init',ci,card:ace.card,src:ace.src});
          _applyMoveToState(G,UI,{type:'init',ci,card:ace.card,src:ace.src});
        } else {
          if(G.pioche.length===0&&G.futurePioche.length>0){G.pioche=shuffle([...G.futurePioche]);G.futurePioche=[];}
          if(G.pioche.length>0){
            const drawn_d=G.pioche.pop();
            G.commons[ci].push(drawn_d);
            if(drawn_d.num===13) resolveKingPushed(ci);
            else{UI.pileKingVal[ci]=null;UI.pileKingPending[ci]=false;}
            _q({type:'init',ci,card:drawn_d,src:null,fromPioche:true});
          }
        }
        break; // une seule pile à la fois
      }
    }
  }

  const crTop=peek(p.crapette);const crNum=crTop?crTop.num:7;const opp=1-G.cur;
  const oppP=G.players[opp];

  // Jouer TOUTES les cartes jouables depuis la main avant de défausser
  // Après chaque coup, re-vérifier les piles à dame (écarter) et les piles vides (init)
  let moved=true;
  while(moved&&G.phase!=='game-over'){
    moved=false;
    // Vérifier piles à dame → écarter
    for(let ci=0;ci<4;ci++){
      if(topNum(ci)===12){
        _q({type:'clear',ci});_applyMoveToState(G,UI,{type:'clear',ci});
        moved=true;break;
      }
    }
    if(moved) continue;
    // Piles vides avec as visible → imposé par règle
    for(let ci=0;ci<4;ci++){
      if(G.commons[ci].length===0){
        const ace=_findAce();
        if(ace){
          const mva={type:'init',ci,card:ace.card,src:ace.src};
          _q(mva);_applyMoveToState(G,UI,mva);
          moved=true;break;
        }
        // Init depuis pioche = choix stratégique, pas imposé → géré séparément
      }
    }
    if(moved) continue;
    // Jouer cartes jouables depuis la main (rois utiles inclus) — meilleure pile
    {
      const allMoves=[];
      for(const card of p.hand){
        if(card.num===13){
          for(let ci=0;ci<4;ci++)
            if(canOnCommon(card,ci)&&_kingIsUseful(ci))
              allMoves.push({type:'play',card,src:{type:'hand'},ci});
          continue;
        }
        for(let ci=0;ci<4;ci++)
          if(canOnCommon(card,ci))
            allMoves.push({type:'play',card,src:{type:'hand'},ci});
      }
      if(allMoves.length){
        allMoves.sort((a,b)=>{
          const dp=_mvPrio(b,G,UI,G.cur)-_mvPrio(a,G,UI,G.cur);
          return dp!==0?dp:_mvKey(a)-_mvKey(b);
        });
        const best=allMoves[0];
        _q(best);_applyMoveToState(G,UI,best);
        moved=true;
      }
    }
  }

  // Si pile vide ET aucune carte de main jouable → init depuis pioche avant de défausser
  const anyPlayable=p.hand.some(hc=>hc.num!==13&&_handCardIsPlayable(hc));
  if(!anyPlayable){
    for(let ci=0;ci<4;ci++){
      if(G.commons[ci].length===0&&(G.pioche.length>0||G.futurePioche.length>0)){
        if(G.pioche.length===0){G.pioche=shuffle([...G.futurePioche]);G.futurePioche=[];}
        if(G.pioche.length>0){
          const drn=G.pioche.pop();
          const mva={type:'init',ci,card:drn,src:null,fromPioche:true};
          _q(mva);_applyMoveToState(G,UI,mva);
          if(topNum(ci)===12){
            _q({type:'clear',ci});_applyMoveToState(G,UI,{type:'clear',ci});
          }
          // Rejouer avec la pile nouvellement initialisée
          let mv2=true,it2=0;
          while(mv2&&it2<50&&G.phase!=='game-over'){mv2=_aiGreedyMove();it2++;}
        }
        break; // une seule pile à la fois
      }
    }
  }

  // Les candidats à la défausse = cartes restantes non jouables (hors rois)
  let cands=p.hand.filter(c=>c.num!==13&&!_handCardIsPlayable(c));
  // Rois : jouer si utile, sinon ne pas défausser (garder pour plus tard)
  if(!cands.length&&p.hand.length){
    // Essayer de jouer un roi utile
    for(const k of [...p.hand].filter(c=>c.num===13)){
      for(let ci=0;ci<4;ci++){
        if(canOnCommon(k,ci)&&_kingPlayable(G,UI,G.cur,ci,false)){
          _q({type:'play',card:k,src:{type:'hand'},ci});
          _applyMoveToState(G,UI,{type:'play',card:k,src:{type:'hand'},ci});
          break;
        }
      }
    }
    cands=p.hand.filter(c=>c.num!==13&&!_handCardIsPlayable(c));
  }
  if(!cands.length) cands=p.hand.filter(c=>c.num!==13);
  if(!cands.length) cands=[...p.hand];
  let toDiscard=null,src={type:'hand'};
  if(cands.length){
    const aceDanger=_aceDangerousToDiscard(opp);
    cands.sort((a,b)=>{
      const sa=_discardPriority(a,crNum,opp,aceDanger,p);
      const sb=_discardPriority(b,crNum,opp,aceDanger,p);
      return sb-sa; // score élevé = défausser en premier
    });
    toDiscard=cands[0];
  }
  // JAMAIS défausser depuis la crapette
  if(!toDiscard){
    // Main vide ou rien de défaussable → enregistrer un move 'redraw'
    // Le redraw sera exécuté pendant le replay (pas pendant la simulation)
    _q({type:'redraw'});
    return;
  }
  const di=_aiBestDef(toDiscard);
  _q({type:'discard',card:toDiscard,src,di});
}

// Score de priorité de défausse : score ÉLEVÉ = à défausser en premier
// Vérifier si une carte de la main peut être jouée sur une pile commune
function _handCardIsPlayable(card){
  for(let ci=0;ci<4;ci++) if(canOnCommon(card,ci)) return true;
  return false;
}

function _discardPriority(card, crNum, opp, aceDanger, p){
  let score=0;

  // 1. Doublon de la crapette → défausser en priorité
  if(crNum>0 && card.num===crNum) return 100;

  // 2. Distance circulaire vers la crapette
  // La carte n est précieuse si elle est proche de crNum-1 dans le cycle 1..12
  // dist = (crNum-1 - n + 12) mod 12
  // dist=0 → n est juste avant la crapette (ex: n=2, crNum=3) → très précieux
  // dist=11 → n est juste après la crapette → peu utile
  if(crNum>0 && card.num!==crNum){
    const target=crNum-1; // valeur juste avant la crapette
    const dist=(target-card.num+12)%12;
    const count=p.hand.filter(hc=>hc.num===card.num).length;
    if(count===1){
      score-=Math.max(0,(11-dist)*4); // dist=0→-44, dist=2→-36, dist=10→-4
    } else {
      score+=Math.max(0,(11-dist)*2); // doublon → défausser l'un
    }
  }

  // 4. As dangereux
  if(card.num===1 && aceDanger) score-=30;

  // 5. Demandable par l'adversaire → pénaliser
  if(_wouldBedemandable(card)) score-=20;

  // 6. Jouable sur une pile → malus fort (jouer > défausser)
  for(let ci=0;ci<4;ci++){
    if(canOnCommon(card,ci)){
      const oppCrTop=peek(G.players[opp].crapette);
      const danger=(card.num===1&&oppCrTop&&oppCrTop.num===2&&!visibleAce(opp));
      if(!danger) score-=30;
      break;
    }
  }

  // 7. Doublon en main → bonus à défausser
  const cnt=p.hand.filter(hc=>hc.num===card.num).length;
  if(cnt>=2) score+=15;

  return score;
}

// Défausser un as est dangereux si :
// - l'adversaire a un 2 en crapette (notre as l'aiderait)
// - ET l'adversaire n'a pas d'as visible (sinon la pile serait déjà initialisée)
// - ET on n'a pas de 2 pour l'empêcher d'exploiter notre as
function _aceDangerousToDiscard(oppIdx){
  const opp=G.players[oppIdx];
  const oppCrTop=peek(opp.crapette);
  if(!oppCrTop||oppCrTop.num!==2) return false; // adversaire n'a pas de 2 en crapette
  // L'adversaire a-t-il un as visible ? Si oui, pas de danger supplémentaire
  const oppHasVisibleAce=visibleAce(oppIdx);
  if(oppHasVisibleAce) return false;
  // On n'a pas de 2 pour bloquer → l'as débloquera l'adversaire
  const myP=G.players[G.cur];
  const iHave2=myP.hand.some(c=>c.num===2)||
               (peek(myP.crapette)&&peek(myP.crapette).num===2)||
               myP.defausse.some(d=>{const t=peek(d);return t&&t.num===2;});
  // Si on a un 2 visible, on pourrait jouer dessus après → moins dangereux
  if(iHave2) return false;
  return true; // dangereux : ne pas défausser l'as
}

function _wouldBedemandable(card){
  for(let ci=0;ci<4;ci++) if(canOnCommon(card,ci))return true;return false;
}

function _aiBestDef(card){
  const p=G.players[G.cur];
  const crTop=peek(p.crapette);
  const crNum=crTop?crTop.num:7;
  const opp=1-G.cur;

  // Valeurs actuellement visibles dans toutes les sources (pour éviter doublons)
  const visibleNums=new Set();
  // Défausses adversaire
  G.players[opp].defausse.forEach(d=>{const t=peek(d);if(t)visibleNums.add(t.num);});
  // Crapette IA
  if(crTop) visibleNums.add(crTop.num);
  // Défausses IA (valeurs actuellement visibles AVANT cette défausse)
  p.defausse.forEach(d=>{const t=peek(d);if(t)visibleNums.add(t.num);});

  let best=0,bs=-999;
  for(let i=0;i<4;i++){
    const t=peek(p.defausse[i]);let sc=0;

    // As sur as → priorité absolue
    if(card.num===1&&t&&t.num===1){sc=100;}
    // Pile vide → neutre
    else if(!t){sc=3;}
    // Ne pas couvrir un as
    else if(t.num===1&&card.num!==1){sc=-10;}
    else {
      // Base : préférer mettre une petite valeur sur une grande
      sc=(card.num<t.num)?2:1;

      // Bonus : la valeur du sommet actuel (t) est un doublon visible ailleurs
      // → la couvrir ne fait pas perdre d'information
      const tNumIsElsewhere=p.defausse.some((d,j)=>{
        if(j===i) return false;
        const tj=peek(d);return tj&&tj.num===t.num;
      })||crNum===t.num;
      if(tNumIsElsewhere) sc+=5; // doublon visible → couvrir sans perte

      // Malus : la valeur du sommet actuel (t) est unique → la couvrir fait perdre de l'info
      if(!tNumIsElsewhere) sc-=3;

      // Malus : ne pas couvrir une carte proche de la crapette (utile à garder visible)
      const target=crNum-1;
      const distT=(target-t.num+12)%12;
      if(distT<=3) sc-=4; // valeur précieuse → ne pas couvrir

      // Bonus : couvrir une carte demandable par l'adversaire
      if(_wouldBedemandable(t)) sc+=4;

      // Malus : ne pas couvrir avec une valeur déjà visible en défausse soi-même
      const cardAlreadyVisible=p.defausse.some((d,j)=>{
        if(j===i) return false;
        const tj=peek(d);return tj&&tj.num===card.num;
      });
      if(cardAlreadyVisible) sc-=2;

      // Bonus : préférer les piles courtes (moins de cartes = plus d'accès)
      const pileLen=p.defausse[i].length;
      sc+=Math.max(0,4-pileLen); // pile vide→+4, 1 carte→+3, 2→+2, 3→+1, ≥4→0

      // Malus : si une des 2-3 premières cartes sous le sommet est précieuse
      // et non disponible ailleurs → préserver l'accès
      const pile=p.defausse[i];
      const depth=Math.min(3,pile.length-1); // regarder jusqu'à 3 cartes sous le sommet
      for(let d=1;d<=depth;d++){
        const buried=pile[pile.length-1-d];
        if(!buried) break;
        const bTarget=(crNum-1);
        const bDist=(bTarget-buried.num+12)%12;
        if(bDist<=4){
          // Carte précieuse enfouie - est-elle disponible ailleurs ?
          const availableElsewhere=
            p.hand.some(h=>h.num===buried.num)||
            p.defausse.some((d2,j)=>j!==i&&d2.some(c2=>c2.num===buried.num))||
            (crTop&&crTop.num===buried.num);
          if(!availableElsewhere){
            sc-=(5-d)*3; // plus elle est proche du sommet, plus le malus est fort
          }
        }
      }
    }

    if(sc>bs){bs=sc;best=i;}
  }
  return best;
}

function renderPzone(pidx){
  const p=G.players[pidx];
  const isActive=G.cur===pidx&&G.phase!=='game-over';
  const isAI=UI.vsAI&&pidx===UI.aiIdx;

  let h=`<div class="pzone ${isActive?'active':'inactive'}">`;
  h+=`<div class="plabel">
    <span class="nm">${p.name}${isActive?' ▶':''}</span>
    <span class="cr">Crapette:${p.crapette.length}</span>
    <span style="font-size:0.6rem">Pioche:${G.pioche.length}+${G.futurePioche.length}</span>
  </div>`;

  h+=`<div class="prow">`;

  // ── Colonne gauche : crapette seule ──
  const crTop=peek(p.crapette);
  const crSel=UI.sel&&crTop&&UI.sel.card.uid===crTop.uid&&UI.sel.src.type==='crapette'?'sel':'';
  h+=`<div class="cr-col" onclick="clickCrapette(${pidx})">`;
  h+=`<div class="crstack">`;
  if(p.crapette.length>1) h+=`<div class="card down back"></div>`;
  if(crTop){
    h+=`<div class="card ${crTop.color} ${crSel} front" data-crapette="${pidx}">
      <div class="ct">${crTop.value}</div><div class="cs">${crTop.suit}</div><div class="cb">${crTop.value}</div>
    </div>`;
  } else {
    h+=`<div class="slot front"><span class="slbl">Vide</span></div>`;
  }
  h+=`</div></div>`;

  // ── Colonne droite : défausses + main ──
  h+=`<div class="right-col">`;

  // Défausses en éventail
  h+=`<div class="dzone">`;
  for(let di=0;di<4;di++){
    const pile=p.defausse[di];
    const vtgt=pidx===G.cur&&isHumanTurn()&&UI.sel&&canOnDefausse(UI.sel.card,pile);
    const n=pile.length;const OFF=11;
    const isDemandable=pidx!==G.cur&&isHumanTurn()&&wasPlayableAtStartOfTurn(pidx,di);
    const totalH=n>0?`calc(var(--ch) + ${Math.max(0,n-1)*OFF}px)`:`var(--ch)`;
    h+=`<div class="dpile${vtgt?' vtgt':''}" style="height:${totalH}"
        data-def-slot="${pidx}-${di}"
        onclick="clickDefausse(${pidx},${di})">`;
    if(n===0){
      h+=`<div class="slot" style="position:absolute;inset:0;width:var(--cw);height:var(--ch);">
        <span class="slbl">D${di+1}</span></div>`;
    } else {
      for(let k=0;k<n;k++){
        const card=pile[k];const isTop=k===n-1;
        const isSel=isTop&&UI.sel&&UI.sel.card.uid===card.uid&&UI.sel.src.type==='defausse'&&UI.sel.src.index===di;
        const dem=isTop&&isDemandable?'demandable':'';
        h+=`<div class="card ${card.color} ${isSel?'sel':''} ${dem} dcard"
          style="position:absolute;top:${k*OFF}px;z-index:${k+1};left:0;width:var(--cw);
            ${!isTop?`height:${OFF}px;overflow:hidden;border-bottom:none;border-radius:5px 5px 0 0;`:''}"
          ${isTop?`data-def-top="${pidx}-${di}"`:''}>
          <div class="ct">${card.value}${!isTop?card.suit:''}</div>
          ${isTop?`<div class="cs">${card.suit}</div><div class="cb">${card.value}</div>`:''}
        </div>`;
      }
    }
    h+=`</div>`;
  }
  h+=`</div>`; // dzone

  // Main (dans la colonne droite)
  h+=`<div class="hand">`;
  if(isAI&&!_debugMode){
    for(const card of p.hand) h+=`<div class="card down" data-hand-uid="${card.uid}"></div>`;
  } else {
    for(const card of p.hand){
      const isSel=UI.sel&&UI.sel.card.uid===card.uid&&UI.sel.src.type==='hand';
      h+=`<div class="card ${card.color} ${isSel?'sel':''}"
        onclick="clickHand(${card.uid})" data-hand-uid="${card.uid}">
        <div class="ct">${card.value}</div><div class="cs">${card.suit}</div><div class="cb">${card.value}</div>
      </div>`;
    }
    if(!p.hand.length) h+=`<span style="color:var(--gold);font-size:0.7rem;align-self:center;cursor:pointer;text-decoration:underline dotted;" onclick="clickEmptyHand()">Main vide — piocher</span>`;
  }
  h+=`</div>`; // hand

  h+=`</div></div></div>`; // right-col + prow + pzone
  return h;
}

function renderMiddle(){
  let h=`<div id="mid"><div class="mid-inner">`;

  // Pioche
  h+=`<div class="pioche-col">
    <div class="zone-lbl">Pioche</div>`;
  if(G.pioche.length){
    h+=`<div class="card down" onclick="clickPioche()" style="cursor:pointer;" title="Piocher"></div>`;
  } else {
    h+=`<div class="slot" onclick="clickPioche()" style="cursor:pointer;"><span class="slbl">Vide</span></div>`;
  }
  h+=`<div class="zone-lbl">${G.pioche.length}</div></div>`;

  // 4 piles communes
  h+=`<div class="commons-col">`;
  for(let ci=0;ci<4;ci++){
    const pile=G.commons[ci];const t=peek(pile);
    const vtgt=UI.vtgts.some(v=>v.index===ci);
    const disp=topDisplay(ci);const isPend=UI.pileKingPending[ci];
    let inner='';
    if(t){
      inner=`<div class="card ${t.color}"
        style="position:absolute;inset:0;width:100%;height:100%;border-radius:4px;"
        data-common="${ci}" onclick="clickCommon(${ci})">
        <div class="ct">${disp}${isPend?'<span style="font-size:0.4rem;color:orange;position:absolute;top:1px;right:2px">?</span>':''}</div>
        <div class="cs">${t.suit}</div><div class="cb">${disp}</div>
      </div>`;
    }
    // Pile vide : indiquer l'action possible
    let emptyLabel=`P${ci+1}`;
    if(!t&&isHumanTurn&&G.phase!=='game-over'){
      if(visibleAce(G.cur)) emptyLabel=`P${ci+1}<br><span style="color:var(--green);font-size:0.5rem">as↓</span>`;
      else emptyLabel=`P${ci+1}<br><span style="color:var(--gold);font-size:0.5rem">pioche↓</span>`;
    }
    h+=`<div class="slot${vtgt?' vtgt':''}" data-common="${ci}" onclick="clickCommon(${ci})">
      ${inner||`<span class="slbl" style="line-height:1.4">${emptyLabel}</span>`}
    </div>`;
  }
  h+=`</div>`;

  // Recyclage
  h+=`<div class="fpioche-col">
    <div class="zone-lbl">Recyclage</div>`;
  h+=G.futurePioche.length
    ?`<div class="card down" onclick="clickFuturePioche()" style="cursor:pointer;"></div>`
    :`<div class="slot"><span class="slbl">Vide</span></div>`;
  h+=`<div class="zone-lbl">${G.futurePioche.length}</div></div>`;

  h+=`</div></div>`;
  return h;
}

// ══════════════════════════════════════════════
// LOG
// ══════════════════════════════════════════════
let _moveCount=0;
function addMoveLog(msg,cls='sys'){
  if(window._simulating) return;
  const el=document.getElementById('movelog');
  const e=document.createElement('div');
  e.className='mle '+(cls||'sys');
  // Numéroter les coups de jeu (pas les messages système)
  const prefix=(cls&&cls!=='sys'&&cls!=='turn-sep')?String(++_moveCount)+'. ':''
  e.textContent=prefix+msg;
  el.prepend(e);
  while(el.children.length>30) el.removeChild(el.lastChild);
}
function clearMoveLog(){document.getElementById('movelog').innerHTML='';_moveCount=0;}

function toggleDebug(){
  _debugMode=!_debugMode;
  document.getElementById('btn-debug').style.background=_debugMode?'var(--green)':'var(--bg3)';
  document.getElementById('btn-debug').textContent=_debugMode?'🐛ON':'🐛';
  // Afficher/masquer les contrôles pas-à-pas
  document.getElementById('step-controls').style.display=_debugMode?'flex':'none';
  if(!_debugMode){_stepMode=false;_updateStepUI();}
  render();
  setStatus(_debugMode?'Mode debug activé':'Mode debug désactivé');
}

function _updateStepUI(){
  const cb=document.getElementById('step-check');
  if(cb) cb.checked=_stepMode;
  const btn=document.getElementById('step-next');
  if(!btn) return;
  // Afficher si : pause en attente OU tour IA en mode debug
  const showBtn=_debugMode&&(_stepResolve||(UI.vsAI&&G&&G.cur===UI.aiIdx&&G.phase!=='game-over'));
  btn.style.display=showBtn?'inline-block':'none';
  btn.textContent=_stepResolve?'▶':'▶ IA';
}

function toggleStepMode(){
  _stepMode=document.getElementById('step-check').checked;
  _updateStepUI();
  setStatus(_stepMode?'Pas-à-pas activé — cliquez ▶ pour chaque coup IA':'Pas-à-pas désactivé');
}

function stepNext(){
  if(_stepResolve){
    const fn=_stepResolve;
    _stepResolve=null;
    _updateStepUI();
    fn();
  }
}

function stepOrPlay(){
  if(_stepResolve) stepNext();
  else if(UI.vsAI&&G&&G.cur===UI.aiIdx) aiPlayTurn();
}

// Log la main d'un joueur (appelé en mode debug après chaque coup)
function _debugLogHand(pidx){
  if(!_debugMode||!G) return;
  const p=G.players[pidx];
  const handStr=p.hand.map(c=>c.value+c.suit).join(' ')||'∅';
  const defStr=p.defausse.map(d=>{const t=peek(d);return t?t.value+t.suit:'_';}).join(' ');
  const crTop=peek(p.crapette);
  addMoveLog(`[${p.name}] M:${handStr} | D:${defStr} | Cr:${crTop?crTop.value+crTop.suit:'∅'}(${p.crapette.length})`,'sys');
}

function _fbCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');setStatus('Copié !');}catch(e){setStatus('Copie manuelle nécessaire');}
  ta.remove();
}
function setStatus(msg){document.getElementById('status').textContent=msg;}
function showModal(title,body,btns){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').textContent=body;
  const el=document.getElementById('mbtns');el.innerHTML='';
  for(const b of btns){const btn=document.createElement('button');btn.className='btn';btn.textContent=b.label;btn.onclick=b.fn;el.appendChild(btn);}
  document.getElementById('movl').classList.add('on');
}
function closeModal(){document.getElementById('movl').classList.remove('on');}
function showMenu(){closeModal();clearTimeout(_aiTimer);G=null;UI.sel=null;setStatus('Bienvenue !');renderMenu();}

// ── SNAPSHOT pour debug ──
function snapshot(){
  if(!G){addMoveLog('Pas de partie en cours','sys');return;}
  const state={
    tour:G.players[G.cur].name,
    piles:G.commons.map((p,i)=>({
      top:peek(p)?cs(peek(p)):'vide',
      n:p.length,
      kingVal:UI.pileKingVal[i],
      kingPend:UI.pileKingPending[i]
    })),
    joueurs:G.players.map((p,i)=>({
      nom:p.name,
      crapette:p.crapette.length,
      crapetteTop:peek(p.crapette)?cs(peek(p.crapette)):'vide',
      main:p.hand.map(cs),
      defausses:p.defausse.map(d=>peek(d)?cs(peek(d)):'vide')
    })),
    pioche:G.pioche.length,
    recyclage:G.futurePioche.length
  };
  const txt=JSON.stringify(state,null,1);
  // Afficher dans une modale
  // Construire la modale manuellement pour accès à txt dans le bouton copie
  document.getElementById('mtitle').textContent='📋 Snapshot';
  document.getElementById('mbody').style.cssText='text-align:left;font-size:0.6rem;font-family:monospace;white-space:pre-wrap;max-height:55vh;overflow-y:auto;color:var(--text)';
  document.getElementById('mbody').textContent=txt;
  const btnsEl=document.getElementById('mbtns');btnsEl.innerHTML='';
  const cpBtn=document.createElement('button');cpBtn.className='btn';cpBtn.textContent='📋 Copier';
  cpBtn.onclick=()=>{
    const t=document.getElementById('mbody').textContent;
    const done=()=>{setStatus('Copié !');closeModal();};
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(done).catch(()=>{_fbCopy(t);done();});}
    else{_fbCopy(t);done();}
  };
  const clBtn=document.createElement('button');clBtn.className='btn';clBtn.textContent='Fermer';clBtn.onclick=closeModal;
  btnsEl.appendChild(cpBtn);btnsEl.appendChild(clBtn);
  document.getElementById('movl').classList.add('on');
}

// ══════════════════════════════════════════════
// LAYOUT ADAPTATIF
// ══════════════════════════════════════════════
function computeLayout(){
  const root=document.documentElement;
  const gameEl=document.getElementById('game');
  const sideW=parseInt(getComputedStyle(root).getPropertyValue('--log-w'))||115;

  // Espace disponible pour le jeu
  const totalW=window.innerWidth;
  const totalH=window.innerHeight;
  const hdrH=document.getElementById('hdr').offsetHeight||32;
  const statusH=document.getElementById('status').offsetHeight||22;
  const abarH=document.getElementById('abar').offsetHeight||32;
  const gameW=totalW-sideW-5; // 5px resizer
  const gameH=totalH-hdrH-statusH-abarH;

  // Estimer la hauteur nécessaire pour le contenu
  // Layout : pzone(top) + mid + pzone(bot)
  // pzone = label(~18px) + prow(ch+8px) + hand(ch+2px) + gaps = ch*2 + 50px
  // mid = ch + 30px (labels + gaps)
  // Total estimé = ch*5 + 130px
  // On résout : ch = (gameH - 130) / 5
  // Avec contrainte : largeur doit contenir crapette + 4 défausses + main(5 cartes) + gaps
  // Largeur: crstack(cw+8) + gap + 4*(cw+3) + gap + 5*(cw+3) = 10*cw + 8 + 4*3 + 3 + 5*3 = 10cw + 38
  // Plus les piles communes: pioche + 4*(cw+5) + recyclage = 6cw + 30
  // On prend le max du contexte joueur
  // max_cw_h = (gameH - 130) / 5
  // max_cw_w = (gameW - 50) / 11  (crapette+4def+5main+gaps)
  const cwH=Math.floor((gameH-130)/5);
  const cwW=Math.floor((gameW-60)/11);
  let cw=Math.max(32,Math.min(62,cwH,cwW));
  let ch=Math.round(cw*1.41); // ratio carte standard

  root.style.setProperty('--cw',cw+'px');
  root.style.setProperty('--ch',ch+'px');
  // Fontes proportionnelles
  root.style.setProperty('--cf',Math.max(8,Math.round(cw*0.22))+'px');
  root.style.setProperty('--cs',Math.max(10,Math.round(cw*0.38))+'px');

  // Font log adaptative à la largeur du sidebar
  const logFs=Math.max(8,Math.min(11,Math.round(sideW/12)));
  root.style.setProperty('--log-fs',logFs+'px');
}

// Resizer drag
(function(){
  const resizer=document.getElementById('resizer');
  const sidebar=document.getElementById('sidebar');
  let dragging=false,startX=0,startW=0;

  resizer.addEventListener('mousedown',e=>{
    dragging=true;startX=e.clientX;
    startW=sidebar.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  resizer.addEventListener('touchstart',e=>{
    dragging=true;startX=e.touches[0].clientX;
    startW=sidebar.offsetWidth;
    resizer.classList.add('dragging');
  },{passive:true});

  function onMove(x){
    if(!dragging) return;
    const dx=startX-x; // tirer vers la gauche agrandit le sidebar
    const newW=Math.max(50,Math.min(window.innerWidth*0.5,startW+dx));
    document.documentElement.style.setProperty('--log-w',newW+'px');
    sidebar.style.width=newW+'px';
    computeLayout();
  }
  document.addEventListener('mousemove',e=>onMove(e.clientX));
  document.addEventListener('touchmove',e=>onMove(e.touches[0].clientX),{passive:true});
  function onUp(){
    if(!dragging) return;
    dragging=false;
    resizer.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
    computeLayout();
  }
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchend',onUp);
})();

window.addEventListener('resize',()=>{computeLayout();});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
computeLayout();
renderMenu();
